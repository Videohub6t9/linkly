name = "linkly"
main = "src/index.ts"
compatibility_date = "2025-11-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "LINKS"
id = "REPLACE_WITH_KV_ID"

[[d1_databases]]
binding = "DB"
database_name = "linkly-db"
database_id = "REPLACE_WITH_D1_ID"

[vars]
ACCESS_TEAM_DOMAIN = "yourteam.cloudflareaccess.com"
ACCESS_AUD = "REPLACE_WITH_ACCESS_APP_AUD_TAG"
ALLOWED_DOMAINS = "linkly.YOURSUBDOMAIN.workers.dev"

[observability]
enabled = true
